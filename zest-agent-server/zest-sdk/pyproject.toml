[project]
name = "zest-sdk"
version = "1.10.0"
description = "Core functionality for building AI agents"

requires-python = ">=3.12"
dependencies = [
    "zest-common",
    "deprecation>=2.1.0",
    "filelock>=3.20.1",
    "httpx>=0.27.0",
    "litellm>=1.80.10",
    "pydantic==2.11.7",
    "python-frontmatter>=1.1.0",
    "python-json-logger>=3.3.0",
    "tenacity>=9.1.2",
    "websockets>=12",
    "langfuse>=2.60.3",
    "jieba>=0.42.1",
    "elasticsearch==8.14.0",
    "fastmcp>=3.0.0",
    "aiohttp==3.13.5",
    "oss2>=2.18.0",]

[project.urls]
Source = "https://github.com/CLFutureX/Zest-Agent"

[project.optional-dependencies]
boto3 = ["boto3>=1.35.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["sdk*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed", "*.j2"]

[project]
name = "zest-sdk"
version = "1.10.0"
description = "Core functionality for building AI agents"

requires-python = ">=3.12"
dependencies = [
    "deprecation>=2.1.0",
    "fastmcp>=2.12.0",
    "filelock>=3.20.1",
    "httpx>=0.27.0",
    "litellm>=1.80.10",
    "pydantic>=2.12.5",
    "python-frontmatter>=1.1.0",
    "python-json-logger>=3.3.0",
    "tenacity>=9.1.2",
    "websockets>=12",
    "lmnr>=0.7.24",
    "jieba>=0.42.1",
    "elasticsearch>=8.14.0",
]

[project.urls]
Source = "https://github.com/CLFutureX/Zest-Agent"

[project.optional-dependencies]
boto3 = ["boto3>=1.35.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["sdk*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed", "*.j2"]
